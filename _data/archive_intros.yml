# The short introduction shown above each issue's link on the Archive page, and
# nowhere else. Keyed by issue date; it names some of the issue's headlines rather
# than summarizing the news. An issue with no entry shows only its link.

"2026-11-06": "This issue features Canada's Budget 2026 promise of \"trusted AI agents\" for every post-secondary student and MacEduStack, the AI assessment-drafting tool built in McMaster's Faculty of Engineering. It also covers Stanford's US$10-million push to redesign undergraduate majors for the AI era, and Irish academic unions declaring that AI detection tools and bans are both insufficient."

"2026-10-30": "Highlights include Canada's Tri-agency and CFI barring grant reviewers from using institutionally procured generative AI tools, Ontario tying money for new postsecondary seats to AI, and Canada's plan to invest up to $1.6 billion in Cohere. Also in this issue: privacy regulators calling for research ethics rules to be updated for AI in health, and a Harvard paper reporting that AI reviews beat well-paid human expert reviews on every measure."

"2026-10-23": "This issue features Ontario students calling for province-wide rules and safeguards for AI in postsecondary education, and a study reported by Nature finding that LLM-suggested care plans cost roughly three times what physicians implemented. It also includes Terence Tao's Nature column on whether mathematics can survive AI."

"2026-10-16": "Highlights include the University of Toronto making responsible AI adoption an institution-wide commitment, and Canada making an additional C$500 million available for regional AI adoption and commercialization. Also in this issue: PhD graduates whose dissertations contain AI writing being less likely to stay in academia, the launch of JAMA AI, and a Dutch minister calling AI-written master's theses \"fraud.\""

"2026-10-09": "This issue covers the report from Toronto Metropolitan University's task force on generative AI, Canada's frontier-AI cybersecurity direction, and UK universities dropping Turnitin. It also includes a statement from the Canadian Association of Research Libraries on leading student AI literacy."

"2026-10-02": "Featured here are the University of Toronto's commissioned framework for computing, AI and data science, and Université de Montréal's institution-wide AI vision. The issue also covers York teaching assistants seeking a contract commitment on AI, the launch of Canada's National Council on AI, and arXiv's cap of two submissions a month."

"2026-09-25": "Highlights include Ottawa's commitment of up to $162M for 10,000 AI work placements through Mitacs, and a survey showing very few US institutions have a centralized AI strategy. Also in this issue: the University of Calgary Students' Union urging an end to AI grading, and AI's impact on student learning in US universities."

"2026-09-18": "This issue features McMaster-led EBAiM building evidence standards for clinical AI, and the University of Sydney's campus-wide ChatGPT Edu access with a two-lane assessment model. It also covers Anthropic opening verified access to frontier models for life-sciences research."

"2026-09-12": "Highlights include Ontario allocating $90M to McMaster for 2,769 new funded seats, Waterloo's six-course pilot of pedagogically constrained AI agents, and Canada's $13-million National AI Literacy Initiative. Also in this issue are UKRI's grant assessment overhaul and two stories on AI in mathematics: a declaration by 25 Fields Medallists and OpenAI's claimed Navier–Stokes singularity proof."

"2026-09-06": "This issue covers Wyoming choosing a multi-model enterprise AI platform, Cubby's AI teaching assistants across 20 US law schools, and a KPMG Canada survey finding that three-quarters of students use generative AI for schoolwork. It also includes York University's certificate in AI governance and Canada's Responsible Data Centre Development Principles."

"2026-09-02": "Featured here are classroom AI practices from McMaster's MacPherson Institute, and Georgia Tech's academic AI strategy and faculty-authored playbook. The issue also covers contract and IP objections to a campus ChatGPT rollout, and a Nature article on how far AI-detection tools have come."

"2026-08-31": "This issue covers California requiring human faculty and instructors of record at its state university system, and online-learning leaders describing a shift from AI experimentation to evidence and governance."

"2026-08-29": "This issue features Arizona State University making discipline-specific AI literacy courses available across every college and school."

"2026-08-28": "Highlights include UBC and McGill adding AI-linked research capacity through national chair awards, and more than 100 organizations calling for a surge in AI-enabled cyber defence. Also in this issue: Bill Gates on AI's impact and the choices we should be making now."

"2026-08-27": "This issue features McMaster securing $43 million for research chairs and emerging leaders, and the University of Colorado's systemwide responsible-use policy for AI. It also covers a randomized trial involving ChatGPT Edu."

"2026-08-26": "This issue covers MIT's final report calling for institution-wide, continuously adapting AI education practices, and a Waterloo-led study finding open-weight model safeguards vulnerable to tampering."

"2026-08-25": "Highlights include Dalhousie launching the Atlantic AI Institute and a US accreditor adopting foundational AI principles. Also in this issue: Google offering eligible university students a year of paid-tier Gemini access at no charge."
