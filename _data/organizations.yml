# THE list of organizations. This file is both the site's data and your
# reference: read it here when you need to check a name.
#
# When a story names an organization for the first time, add it below with
# its kind. A name used in an item but missing here still appears on the
# organizations page, under "Unclassified" -- so a forgotten or misspelled
# name is visible, never lost.
#
# Copy names from this file rather than retyping them: two spellings of one
# organization silently become two entries.
#
# What to list on an item: the organizations the story is ABOUT -- the actors
# in it -- not every name mentioned in passing. Two to four is usually right.
# Use the common short form consistently ("MIT", not "Massachusetts Institute
# of Technology"), and leave the country out of the name.
#
# Kinds and their order on the page are set by organization_kinds in
# _config.yml. Current item counts are on /organizations/ itself.

